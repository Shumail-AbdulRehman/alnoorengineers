    <script>
      // Set theme before first paint to avoid a flash of the wrong mode.
      // Dark is the default; light applies when chosen before, forced via
      // ?theme=light|dark, or preferred by the OS.
      (function () {
        try {
          var q = new URLSearchParams(window.location.search).get('theme')
          if (q === 'light') {
            document.documentElement.classList.add('light')
            return
          }
          if (q === 'dark') return
          var stored = localStorage.getItem('ane-theme')
          if (
            stored === 'light' ||
            (stored === null &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          ) {
            document.documentElement.classList.add('light')
          }
        } catch (e) {
          /* storage unavailable */
        }
      })()
    </script>
