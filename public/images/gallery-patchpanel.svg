<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Fiber patch panel illustration">
  <rect width="480" height="360" fill="#101713"/>
  <rect x="40" y="70" width="400" height="220" fill="#161f1b" stroke="#243029" stroke-width="2"/>
  <!-- LC ports -->
  <g fill="#0e1613" stroke="#3f6b5c" stroke-width="2">
    <circle cx="90" cy="120" r="10"/><circle cx="130" cy="120" r="10"/>
    <circle cx="90" cy="170" r="10"/><circle cx="130" cy="170" r="10"/>
    <circle cx="90" cy="220" r="10"/><circle cx="130" cy="220" r="10"/>
  </g>
  <!-- patch cords -->
  <path d="M90 120 C 160 60, 260 60, 320 120" fill="none" stroke="#e8a33d" stroke-width="4"/>
  <path d="M130 170 C 200 240, 280 240, 350 170" fill="none" stroke="#e8a33d" stroke-width="4"/>
  <path d="M90 220 C 150 290, 250 290, 320 220" fill="none" stroke="#3f6b5c" stroke-width="4"/>
  <!-- label strips -->
  <rect x="200" y="110" width="220" height="20" fill="#f4f2ea" opacity="0.9"/>
  <rect x="200" y="150" width="220" height="20" fill="#f4f2ea" opacity="0.65"/>
  <rect x="200" y="190" width="220" height="20" fill="#f4f2ea" opacity="0.9"/>
  <g font-family="monospace" font-size="12" fill="#0e1613">
    <text x="210" y="124">ODF-01 · 96F</text>
    <text x="210" y="164">ODF-02 · 144F</text>
    <text x="210" y="204">ODF-03 · 48F</text>
  </g>
  <g font-family="monospace" font-size="11" fill="#5c6a60">
    <text x="40" y="320">SM G.657A2 PATCH CORDS · LC/UPC — SC/APC</text>
  </g>
</svg>
